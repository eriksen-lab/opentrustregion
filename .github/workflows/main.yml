name: CI
on:
  push:
    branches:
      - main
      - 'ci-debug/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  formatting:
    name: "Formatting • black + clang-format"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout OpenTrustRegion
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x

    - name: Install black
      run: pip install black

    - name: Check Python formatting
      run: black --check --diff pyopentrustregion

    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format

    - name: Check C formatting
      run: git ls-files '*.c' '*.h' | xargs clang-format --dry-run --Werror

  build-test-repo:
    strategy:
      fail-fast: false
      matrix:
        include:
          # test for pip installation
          - os: linux
            compiler: gnu
            runs-on: ubuntu-latest
            build-type: install
            scenario: installed
            integer-size: "32"
            cmargs: ""

          # test for editable pip installation
          - os: linux
            compiler: gnu
            runs-on: ubuntu-latest
            build-type: install
            scenario: editable
            integer-size: "32"
            cmargs: ""

          # test for cmake installation
          - os: linux
            compiler: gnu
            runs-on: ubuntu-latest
            build-type: install
            scenario: dev-build
            integer-size: "32"
            cmargs: ""

          # testsuite running with gnu compilers on linux with 32-bit integers
          - os: linux
            compiler: gnu
            runs-on: ubuntu-latest
            build-type: test
            integer-size: "32"
            cmargs: ""

          # testsuite running with intel compilers on linux with 32-bit integers
          - os: linux
            compiler: intel
            runs-on: ubuntu-latest
            build-type: test
            integer-size: "32"
            cmargs: ""

          # testsuite running with gnu compilers on linux with 64-bit integers
          - os: linux
            compiler: gnu
            runs-on: ubuntu-latest
            build-type: test
            integer-size: "64"
            cmargs: ""

          # testsuite running with intel compilers on linux with 64-bit integers
          - os: linux
            compiler: intel
            runs-on: ubuntu-latest
            build-type: test
            integer-size: "64"
            cmargs: ""

          # testsuite running with clang compilers on macos with arm processors
          - os: macos-silicon
            compiler: clang
            runs-on: macos-latest
            build-type: test
            integer-size: "32"
            cmargs: ""

          # testsuite running with clang compilers on macos with intel processors
          - os: macos-intel
            compiler: clang
            runs-on: macos-15-intel
            build-type: test
            integer-size: "32"
            cmargs: ""

          # test coverage
          - os: linux
            compiler: gnu
            runs-on: ubuntu-latest
            build-type: coverage
            integer-size: "32"
            cmargs: ""

    name: "Repo • OS ${{ matrix.os }} • Compiler ${{ matrix.compiler }} • Build Type ${{ matrix.build-type }}${{ matrix.scenario && format(' ({0})', matrix.scenario) || '' }} • ${{ matrix.integer-size }}-bit integers"
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - name: Checkout OpenTrustRegion
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x

    - name: Install Fortran compiler on MacOS
      if: ${{ contains(matrix.os, 'macos') }}
      run: |
        echo "FC=$(ls $(brew --prefix)/bin/gfortran-* | tail -1)" >> $GITHUB_ENV

    - name: Install GNU compilers on Linux
      if: ${{ matrix.compiler == 'gnu' && matrix.os == 'linux' }}
      run: |
        sudo apt update
        sudo apt install -y gcc gfortran

    - name: Add Intel oneAPI repository
      if: ${{ matrix.compiler == 'intel' }}
      run: |
        wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt update

    - name: Install Intel oneAPI Fortran Compiler
      if: ${{ matrix.compiler == 'intel' }}
      run: sudo apt install -y intel-oneapi-compiler-fortran

    - name: Install Intel oneAPI MKL
      if: ${{ matrix.compiler == 'intel' }}
      run: sudo apt install -y intel-oneapi-mkl

    - name: Setup Intel oneAPI Environment
      if: ${{ matrix.compiler == 'intel' }}
      run: |
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV

    - name: Install OpenBLAS on MacOS
      if: ${{ contains(matrix.os, 'macos') }}
      run: |
        brew install openblas
        BREW_PREFIX=$(brew --prefix)
        echo "PKG_CONFIG_PATH=${BREW_PREFIX}/opt/openblas/lib/pkgconfig" >> $GITHUB_ENV
        echo "LDFLAGS=-L${BREW_PREFIX}/opt/openblas/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I${BREW_PREFIX}/opt/openblas/include" >> $GITHUB_ENV

    - name: Install OpenBLAS (32-bit integers) on Linux
      if: ${{ matrix.compiler == 'gnu' && matrix.os == 'linux' && matrix.integer-size == '32' }}
      run: |
        sudo apt install -y libopenblas-dev

    - name: Install OpenBLAS (64-bit integers) on Linux
      if: ${{ matrix.compiler == 'gnu' && matrix.os == 'linux' && matrix.integer-size == '64' }}
      run: |
        sudo apt install -y libopenblas64-dev

    - name: Build & Install OpenTrustRegion (32-bit integers)
      if: ${{ matrix.integer-size == '32' && (matrix.build-type == 'test' || (matrix.build-type == 'install' && matrix.scenario == 'installed'))}}
      run: pip install -C cmake.define.INTEGER_SIZE=4 ${{github.workspace}}

    - name: Build & Install OpenTrustRegion (64-bit integers)
      if: ${{ matrix.integer-size == '64' && (matrix.build-type == 'test' || (matrix.build-type == 'install' && matrix.scenario == 'installed'))}}
      run: pip install -C cmake.define.INTEGER_SIZE=8 ${{github.workspace}}

    - name: Build & Install OpenTrustRegion (editable)
      if: ${{ matrix.build-type == 'install' && matrix.scenario == 'editable' }}
      run: pip install -e ${{github.workspace}}

    - name: Build & Install OpenTrustRegion (source)
      if: ${{ matrix.build-type == 'install' && matrix.scenario == 'dev-build' }}
      run: |
        set -e
        sudo apt install -y cmake
        pip install numpy
        mkdir build
        cd build
        cmake -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install ..
        cmake --build .
        cmake --install .
        cd $GITHUB_WORKSPACE

    - name: Testing pip installation
      if: ${{ matrix.build-type == 'install' && (matrix.scenario == 'installed' || matrix.scenario == 'editable') }}
      working-directory: ${{ runner.temp }}
      run: python -c "import pyopentrustregion.testsuite"

    - name: Testing dev installation
      if: ${{ matrix.build-type == 'install' && matrix.scenario == 'dev-build' }}
      run: | 
        export PYTHONPATH=${GITHUB_WORKSPACE}
        python -c "import pyopentrustregion.testsuite"

    - name: Testing OpenTrustRegion
      if: ${{ matrix.build-type == 'test' }}
      working-directory: ${{ runner.temp }}
      run: python -m pyopentrustregion.testsuite

    - name: Testing find_package Consumption
      if: ${{ matrix.build-type == 'install' && matrix.scenario == 'dev-build' }}
      run: |
        set -e
        export OpenTrustRegion_DIR=$GITHUB_WORKSPACE/install/lib/cmake/OpenTrustRegion
        mkdir consume_fp && cd consume_fp
        cat > CMakeLists.txt <<EOF
        cmake_minimum_required(VERSION 3.22)
        project(atomtest LANGUAGES C)
        find_package(OpenTrustRegion CONFIG REQUIRED COMPONENTS int${{ matrix.integer-size }})
        include(CMakePrintHelpers)
        cmake_print_properties(
          TARGETS
            OpenTrustRegion::opentrustregion${{ matrix.integer-size }}
            OpenTrustRegion::opentrustregion
            OpenTrustRegion::OpenTrustRegion
          PROPERTIES
            IMPORTED_LINK_DEPENDENT_LIBRARIES
            IMPORTED_LOCATION
            INTERFACE_LOCATION
            INTERFACE_LINK_LIBRARIES
            INTERFACE_INCLUDE_DIRECTORIES
            INTERFACE_COMPILE_DEFINITIONS
            INTERFACE_COMPILE_OPTIONS
            INTERFACE_SYSTEM_INCLUDE_DIRECTORIES
          )
        EOF
        cmake --log-level=VERBOSE .
        cd $GITHUB_WORKSPACE && rm -rf consume_fp

    - name: Install Coverage Tools
      if: ${{ matrix.build-type == 'coverage' }}
      run: pip install coverage

    - name: Build & Install OpenTrustRegion with Coverage Flags
      if: ${{ matrix.build-type == 'coverage' }}
      run: |
        pip install -C cmake.build-type=Debug \
                    -C "cmake.define.CMAKE_Fortran_FLAGS=--coverage -g" \
                    -C build-dir=build ${{github.workspace}}

    - name: Testing OpenTrustRegion with Coverage
      if: ${{ matrix.build-type == 'coverage' }}
      run: coverage run --omit="pyopentrustregion/testsuite.py" -m pyopentrustregion.testsuite

    - name: Generate Coverage Report
      id: coverage
      if: ${{ matrix.build-type == 'coverage' }}
      run: |
        set -e
        coverage xml -o python_coverage.xml
        gcda=$(find build/CMakeFiles/opentrustregion.dir -name '*.gcda')
        gcov -b $gcda
        files=./python_coverage.xml
        for g in $gcda; do
          f=$(basename "$g" .gcda).gcov
          if [ ! -s "$f" ]; then
            echo "::error::gcov did not produce $f"
            exit 1
          fi
          files="$files,./$f"
        done
        echo "files=$files" >> "$GITHUB_OUTPUT"

    - name: Upload Coverage Reports as Artifacts
      if: ${{ matrix.build-type == 'coverage' }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-reports
        path: |
          python_coverage.xml
          *.gcov

    - name: Upload to Codecov
      if: ${{ matrix.build-type == 'coverage' }}
      uses: codecov/codecov-action@v7
      with:
        files: ${{ steps.coverage.outputs.files }}
        disable_search: true
        plugins: noop
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
