name: CI
on:
  push:
    branches:
      - main
      - 'ci-debug/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# a new commit to a pull request cancels the run of its previous commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  formatting:
    name: "Formatting • black + clang-format + f90_layout"
    runs-on: ubuntu-latest
    steps:
    - name: Checkout OpenTrustRegion
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x

    - name: Install black
      run: pip install black

    - name: Check Python formatting
      run: black --check --diff pyopentrustregion setup.py tools

    - name: Install clang-format
      run: sudo apt-get update && sudo apt-get install -y clang-format

    - name: Check C formatting
      run: git ls-files '*.c' '*.h' | xargs clang-format --dry-run --Werror

    - name: Check Fortran formatting
      run: python3 tools/f90_layout.py --all

  build-test-repo:
    strategy:
      fail-fast: false
      matrix:
        include:
          # test for editable pip installation
          - os: linux
            arch: x86_64
            compiler: gnu
            blas: openblas
            runs-on: ubuntu-latest
            build-type: install
            scenario: editable
            python-version: "3.10"
            integer-size: "32"

          # test for cmake installation and find_package consumption
          - os: linux
            arch: x86_64
            compiler: gnu
            blas: openblas
            runs-on: ubuntu-latest
            build-type: install
            scenario: dev-build
            python-version: "3.10"
            integer-size: "32"

          # testsuite on arm processors under linux
          - os: linux
            arch: arm64
            compiler: gnu
            blas: openblas
            runs-on: ubuntu-24.04-arm
            build-type: test
            python-version: "3.10"
            integer-size: "32"

          # testsuite with the oldest supported gnu compiler
          - os: linux
            arch: x86_64
            compiler: gnu
            compiler-version: "10"
            blas: openblas
            runs-on: ubuntu-22.04
            build-type: test
            python-version: "3.10"
            integer-size: "32"

          # testsuite with 64-bit integers against the reference BLAS and LAPACK
          - os: linux
            arch: x86_64
            compiler: gnu
            blas: netlib
            runs-on: ubuntu-latest
            build-type: test
            python-version: "3.10"
            integer-size: "64"

          # testsuite with intel compilers and MKL
          - os: linux
            arch: x86_64
            compiler: intel
            blas: mkl
            runs-on: ubuntu-latest
            build-type: test
            python-version: "3.10"
            integer-size: "32"

          # testsuite with intel compilers and MKL with 64-bit integers
          - os: linux
            arch: x86_64
            compiler: intel
            blas: mkl
            runs-on: ubuntu-latest
            build-type: test
            python-version: "3.10"
            integer-size: "64"

          # testsuite with llvm flang compilers under linux
          - os: linux
            arch: x86_64
            compiler: flang
            compiler-version: "21"
            blas: openblas
            runs-on: ubuntu-24.04
            build-type: test
            python-version: "3.10"
            integer-size: "32"

          # testsuite with llvm flang compilers under macos
          - os: macos
            arch: arm64
            compiler: flang
            blas: openblas
            runs-on: macos-latest
            build-type: test
            python-version: "3.10"
            integer-size: "32"

          # testsuite against Apple's Accelerate
          - os: macos
            arch: arm64
            compiler: gnu
            blas: accelerate
            runs-on: macos-latest
            build-type: test
            python-version: "3.10"
            integer-size: "32"

          # testsuite on intel processors under macos
          - os: macos
            arch: x86_64
            compiler: gnu
            blas: openblas
            runs-on: macos-15-intel
            build-type: test
            python-version: "3.10"
            integer-size: "32"

          # test coverage, which also runs the testsuite with gnu compilers under linux on
          # x86 processors
          - os: linux
            arch: x86_64
            compiler: gnu
            blas: openblas
            runs-on: ubuntu-latest
            build-type: coverage
            python-version: "3.10"
            integer-size: "32"

    name: "Repo • 🐍 ${{ matrix.python-version }} • OS ${{ matrix.os }} ${{ matrix.arch }} • Compiler ${{ matrix.compiler }}${{ matrix.compiler-version && format(' {0}', matrix.compiler-version) || '' }} • BLAS ${{ matrix.blas }} • Build Type ${{ matrix.build-type }}${{ matrix.scenario && format(' ({0})', matrix.scenario) || '' }} • ${{ matrix.integer-size }}-bit integers"
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - name: Checkout OpenTrustRegion
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x

    - name: Install GNU compilers on MacOS
      if: ${{ matrix.os == 'macos' && matrix.compiler == 'gnu' }}
      run: |
        echo "FC=$(ls $(brew --prefix)/bin/gfortran-* | tail -1)" >> $GITHUB_ENV

    - name: Install LLVM Flang on MacOS
      if: ${{ matrix.os == 'macos' && matrix.compiler == 'flang' }}
      run: |
        brew install flang
        echo "FC=$(brew --prefix)/bin/flang" >> $GITHUB_ENV

    - name: Install LLVM Flang on Linux
      if: ${{ matrix.compiler == 'flang' && matrix.os == 'linux' }}
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${{ matrix.compiler-version }} main" | sudo tee /etc/apt/sources.list.d/llvm.list
        sudo apt update
        sudo apt install -y flang-${{ matrix.compiler-version }} libclang-rt-${{ matrix.compiler-version }}-dev
        echo "FC=flang-${{ matrix.compiler-version }}" >> $GITHUB_ENV

    - name: Install GNU compilers on Linux
      if: ${{ matrix.compiler == 'gnu' && matrix.os == 'linux' }}
      run: |
        sudo apt update
        sudo apt install -y gcc ${{ matrix.compiler-version && format('gfortran-{0}', matrix.compiler-version) || 'gfortran' }}
        echo "FC=${{ matrix.compiler-version && format('gfortran-{0}', matrix.compiler-version) || 'gfortran' }}" >> $GITHUB_ENV

    - name: Add Intel oneAPI repository
      if: ${{ matrix.compiler == 'intel' }}
      run: |
        wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt update

    - name: Install Intel oneAPI Fortran Compiler
      if: ${{ matrix.compiler == 'intel' }}
      run: sudo apt install -y intel-oneapi-compiler-fortran

    - name: Install Intel oneAPI MKL
      if: ${{ matrix.blas == 'mkl' }}
      run: sudo apt install -y intel-oneapi-mkl

    - name: Setup Intel oneAPI Environment
      if: ${{ matrix.compiler == 'intel' }}
      run: |
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV

    - name: Install OpenBLAS on MacOS
      if: ${{ matrix.os == 'macos' && matrix.blas == 'openblas' }}
      run: |
        brew install openblas
        echo "PKG_CONFIG_PATH=/usr/local/opt/openblas/lib/pkgconfig" >> $GITHUB_ENV
        echo "LDFLAGS=-L/opt/homebrew/opt/openblas/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I/opt/homebrew/opt/openblas/include" >> $GITHUB_ENV

    - name: Install OpenBLAS on Linux
      if: ${{ matrix.os == 'linux' && matrix.blas == 'openblas' }}
      run: |
        sudo apt install -y libopenblas${{ matrix.integer-size == '64' && '64' || '' }}-dev

    - name: Install reference BLAS and LAPACK on Linux
      if: ${{ matrix.os == 'linux' && matrix.blas == 'netlib' }}
      run: |
        sudo apt install -y libblas${{ matrix.integer-size == '64' && '64' || '' }}-dev liblapack${{ matrix.integer-size == '64' && '64' || '' }}-dev

    - name: Create and Activate Python Virtual Environment
      run: |
        python -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip

    # the reference BLAS and Accelerate are selected explicitly, OpenBLAS and MKL are
    # the libraries the autodetection finds
    - name: Build & Install OpenTrustRegion
      if: ${{ matrix.build-type == 'test' }}
      run: CMAKE_FLAGS="-DINTEGER_SIZE=${{ matrix.integer-size == '64' && '8' || '4' }} ${{ matrix.blas == 'netlib' && '-DBLA_VENDOR=Generic' || matrix.blas == 'accelerate' && '-DBLA_VENDOR=Apple' || '' }}" pip install ${{github.workspace}}

    - name: Build & Install OpenTrustRegion (editable)
      if: ${{ matrix.build-type == 'install' && matrix.scenario == 'editable' }}
      run: pip install -e ${{github.workspace}}

    - name: Build & Install OpenTrustRegion (cmake)
      if: ${{ matrix.build-type == 'install' && matrix.scenario == 'dev-build' }}
      run: |
        set -e
        sudo apt install -y cmake
        pip install numpy
        mkdir build
        cd build
        cmake -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install ..
        cmake --build .
        cmake --install .
        cd $GITHUB_WORKSPACE

    - name: Testing pip installation
      if: ${{ matrix.build-type == 'install' && matrix.scenario == 'editable' }}
      run: python -c "import pyopentrustregion.testsuite"

    - name: Testing dev installation
      if: ${{ matrix.build-type == 'install' && matrix.scenario == 'dev-build' }}
      run: | 
        export PYTHONPATH=${GITHUB_WORKSPACE}
        python -c "import pyopentrustregion.testsuite"

    - name: Testing OpenTrustRegion
      if: ${{ matrix.build-type == 'test' }}
      run: python -m pyopentrustregion.testsuite

    - name: Testing find_package Consumption
      if: ${{ matrix.build-type == 'install' && matrix.scenario == 'dev-build' }}
      run: |
        set -e
        export OpenTrustRegion_DIR=$GITHUB_WORKSPACE/install/lib/cmake/OpenTrustRegion
        mkdir consume_fp && cd consume_fp
        cat > CMakeLists.txt <<EOF
        cmake_minimum_required(VERSION 3.22)
        project(atomtest LANGUAGES C)
        find_package(OpenTrustRegion CONFIG REQUIRED COMPONENTS int${{ matrix.integer-size }})
        include(CMakePrintHelpers)
        cmake_print_properties(
          TARGETS
            OpenTrustRegion::opentrustregion${{ matrix.integer-size }}
            OpenTrustRegion::opentrustregion
            OpenTrustRegion::OpenTrustRegion
          PROPERTIES
            IMPORTED_LINK_DEPENDENT_LIBRARIES
            IMPORTED_LOCATION
            INTERFACE_LOCATION
            INTERFACE_LINK_LIBRARIES
            INTERFACE_INCLUDE_DIRECTORIES
            INTERFACE_COMPILE_DEFINITIONS
            INTERFACE_COMPILE_OPTIONS
            INTERFACE_SYSTEM_INCLUDE_DIRECTORIES
          )
        EOF
        cmake --log-level=VERBOSE .
        cd $GITHUB_WORKSPACE && rm -rf consume_fp

    - name: Install Coverage Tools
      if: ${{ matrix.build-type == 'coverage' }}
      run: pip install coverage

    - name: Build & Install OpenTrustRegion with Coverage Flags
      if: ${{ matrix.build-type == 'coverage' }}
      run: |
        CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=Debug -DCMAKE_Fortran_FLAGS='--coverage -g'" pip install ${{github.workspace}}

    - name: Testing OpenTrustRegion with Coverage
      if: ${{ matrix.build-type == 'coverage' }}
      run: coverage run --omit="pyopentrustregion/testsuite.py" -m pyopentrustregion.testsuite

    - name: Generate Coverage Report
      id: coverage
      if: ${{ matrix.build-type == 'coverage' }}
      run: |
        set -e
        coverage xml -o python_coverage.xml
        gcda=$(find build/CMakeFiles/opentrustregion.dir -name '*.gcda')
        gcov -b $gcda
        files=./python_coverage.xml
        for g in $gcda; do
          f=$(basename "$g" .gcda).gcov
          if [ ! -s "$f" ]; then
            echo "::error::gcov did not produce $f"
            exit 1
          fi
          files="$files,./$f"
        done
        echo "files=$files" >> "$GITHUB_OUTPUT"

    - name: Upload Coverage Reports as Artifacts
      if: ${{ matrix.build-type == 'coverage' }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage-reports
        path: |
          python_coverage.xml
          *.gcov

    - name: Upload to Codecov
      if: ${{ matrix.build-type == 'coverage' }}
      uses: codecov/codecov-action@v7
      with:
        files: ${{ steps.coverage.outputs.files }}
        disable_search: true
        plugins: noop
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  # single check for branch protection to require, so that changes to the jobs above do
  # not require changes to the required checks; it runs always, since a required check
  # that is skipped after a failed job counts as passed
  ci-result:
    name: "CI result"
    if: always()
    needs: [formatting, build-test-repo]
    runs-on: ubuntu-latest
    steps:
    - name: Check that every job succeeded
      run: |
        test "${{ needs.formatting.result }}" = success
        test "${{ needs.build-test-repo.result }}" = success
