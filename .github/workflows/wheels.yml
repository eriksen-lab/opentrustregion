name: Wheels

on:
  # build and check the distributions on demand and before a release
  workflow_dispatch:
    inputs:
      publish_to:
        description: "Where to upload the built distributions"
        required: true
        default: "none"
        type: choice
        options: [none, testpypi, pypi]
  pull_request:
    paths:
      - "pyproject.toml"
      - "CMakeLists.txt"
      - ".github/workflows/wheels.yml"
  release:
    types: [published]

# one run at a time per ref: stale pull request runs are superseded, while dispatch and
# release runs queue instead, so two of them can never reach the publish job at once
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-wheels:
    name: "Wheel • ${{ matrix.os }}"
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x86_64
            runs-on: ubuntu-latest
          - os: linux-aarch64
            runs-on: ubuntu-24.04-arm
          - os: macos-arm64
            runs-on: macos-14
            macos-target: "14.0"
          - os: macos-x86_64
            runs-on: macos-15-intel
            macos-target: "15.0"

    steps:
    - name: Checkout OpenTrustRegion
      uses: actions/checkout@v4

    - name: Build wheel
      uses: pypa/cibuildwheel@v4.2
      env:
        # the library is loaded through ctypes and never links libpython, so
        # scikit-build-core tags the wheel py3-none-<platform> and one build per
        # platform serves every supported Python version
        CIBW_BUILD: "cp311-*"
        CIBW_SKIP: "*-musllinux*"

        # selects the release-wheel override in pyproject.toml, which pins LP64, drops
        # the Fortran testsuite library and excludes the testsuite from the wheel
        CIBW_ENVIRONMENT: "OTR_RELEASE_WHEEL=1"

        # on Linux auditwheel vendors OpenBLAS and libgfortran into the wheel
        CIBW_BEFORE_ALL_LINUX: "dnf install -y openblas-devel || yum install -y openblas-devel"

        # macOS links Apple's Accelerate and a static Fortran runtime
        CIBW_BEFORE_ALL_MACOS: "brew install gcc"
        CIBW_ENVIRONMENT_MACOS: "OTR_RELEASE_WHEEL=1 MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-target }}"

        # the full testsuite cannot run against a published wheel, so drive the
        # public API instead and check that the numbers come out right
        CIBW_TEST_COMMAND: "python -m pyopentrustregion.verify_install"

    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.os }}
        path: wheelhouse/*.whl

  build-sdist:
    name: "Source distribution"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout OpenTrustRegion
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - name: Build sdist
      run: pipx run build --sdist

    # the wheel METADATA and the sdist PKG-INFO are generated by scikit-build-core from
    # the same pyproject.toml, so validating the sdist covers both
    - name: Check distribution metadata
      run: pipx run twine check --strict dist/*.tar.gz

    - name: Install GNU compilers and OpenBLAS
      run: sudo apt update && sudo apt install -y gcc gfortran libopenblas-dev

    - name: Verify the sdist builds and solves
      run: |
        set -e
        python -m venv /tmp/sdist-venv
        /tmp/sdist-venv/bin/pip install dist/*.tar.gz
        # run from outside the checkout, or the pyopentrustregion directory in the
        # working directory shadows the installed package
        cd /tmp && /tmp/sdist-venv/bin/python -m pyopentrustregion.verify_install

    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: dist-sdist
        path: dist/*.tar.gz

  publish:
    name: "Publish"
    needs: [build-wheels, build-sdist]
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_to != 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # trusted publishing exchanges this token for a short-lived PyPI credential, so no 
    # long-lived API token is stored in the repository
    environment: ${{ (github.event_name == 'release' || inputs.publish_to == 'pypi') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true

    - name: Publish to TestPyPI
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to == 'testpypi' }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

    - name: Publish to PyPI
      if: ${{ github.event_name == 'release' || inputs.publish_to == 'pypi' }}
      uses: pypa/gh-action-pypi-publish@release/v1
