name: Wheels

on:
  # build and check the distributions on demand, e.g. before a release, without
  # publishing them
  workflow_dispatch:
  # every pull request, since the source distribution packs nearly every file of the
  # repository and the wheels are built from the sources and tested with the package
  pull_request:
    branches:
      - main
  # publish the distributions of every release, also of a pre-release changed into one
  release:
    types: [released]

# the jobs only read the repository, the publish job requests the token it needs itself
permissions:
  contents: read

# one run at a time per ref: a new commit to a pull request cancels the run of its
# previous commit, while other runs queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-wheels:
    name: "Wheel • ${{ matrix.os }}"
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x86_64
            runs-on: ubuntu-latest
          - os: linux-aarch64
            runs-on: ubuntu-24.04-arm
          - os: macos-arm64
            runs-on: macos-14
            macos-target: "14.0"
          - os: macos-x86_64
            runs-on: macos-15-intel
            macos-target: "15.0"

    steps:
    - name: Checkout OpenTrustRegion
      uses: actions/checkout@v7

    - name: Build wheel
      uses: pypa/cibuildwheel@v4.3
      env:
        # the library is loaded through ctypes and never links libpython, so
        # scikit-build-core tags the wheel py3-none-<platform> and one build per
        # platform serves every supported Python version; it is built and tested with
        # the oldest one that pyproject.toml supports
        CIBW_BUILD: "cp310-*"
        CIBW_SKIP: "*-musllinux*"

        # selects the release-wheel override in pyproject.toml, which pins LP64, drops
        # the Fortran testsuite library and excludes the testsuite from the wheel
        CIBW_ENVIRONMENT: "OTR_RELEASE_WHEEL=1"

        # on Linux auditwheel vendors OpenBLAS and libgfortran into the wheel
        CIBW_BEFORE_ALL_LINUX: "dnf install -y openblas-devel || yum install -y openblas-devel"

        # macOS links Apple's Accelerate and a static Fortran runtime
        CIBW_BEFORE_ALL_MACOS: "brew install gcc"
        CIBW_ENVIRONMENT_MACOS: "OTR_RELEASE_WHEEL=1 MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-target }}"

        # the full testsuite cannot run against a published wheel, so drive the
        # public API instead and check that the numbers come out right
        CIBW_TEST_COMMAND: "python -m pyopentrustregion.verify_install"

    - name: Upload wheel
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ matrix.os }}
        path: wheelhouse/*.whl

  build-sdist:
    name: "Source distribution"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout OpenTrustRegion
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x

    - name: Build sdist
      run: pipx run build --sdist

    # a release publishes the version in CMakeLists.txt, whatever its tag names, so
    # stop one whose tag names another version before anything is uploaded
    - name: Check that the release tag names the version
      if: ${{ github.event_name == 'release' }}
      run: |
        sdist=$(basename dist/*.tar.gz .tar.gz)
        version=${sdist#pyopentrustregion-}
        if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
          echo "::error::Release tag $GITHUB_REF_NAME does not name version $version"
          exit 1
        fi

    # the wheel METADATA and the sdist PKG-INFO are generated by scikit-build-core from
    # the same pyproject.toml, so validating the sdist covers both
    - name: Check distribution metadata
      run: pipx run twine check --strict dist/*.tar.gz

    - name: Install GNU compilers and OpenBLAS
      run: sudo apt update && sudo apt install -y gcc gfortran libopenblas-dev

    # the sdist is installed as a source install is, with the testsuite, so running it
    # checks that the sdist carries everything a source install needs
    - name: Verify the sdist builds and passes the testsuite
      run: |
        set -e
        python -m venv /tmp/sdist-venv
        /tmp/sdist-venv/bin/pip install dist/*.tar.gz
        # run from outside the checkout, or the pyopentrustregion directory in the
        # working directory shadows the installed package
        cd /tmp && /tmp/sdist-venv/bin/python -m pyopentrustregion.testsuite

    - name: Upload sdist
      uses: actions/upload-artifact@v7
      with:
        name: dist-sdist
        path: dist/*.tar.gz

  # a pre-release is never published, since the version from CMakeLists.txt has no
  # pre-release suffix and PyPI would take it as the final release of that version; the
  # released event already leaves pre-releases out, the check keeps them out
  # regardless of the trigger
  publish:
    name: "Publish"
    needs: [build-wheels, build-sdist]
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # trusted publishing exchanges this token for a short-lived PyPI credential, so no
    # long-lived API token is stored in the repository
    environment: pypi
    permissions:
      id-token: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v8
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
